<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive History Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Interactive History Map</h1>
      <p class="subtitle">Paste a passage. The places it mentions get pinned on the map.</p>
    </header>

    <details id="settings">
      <summary>Settings</summary>
      <label for="provider">Provider</label>
      <select id="provider"></select>

      <div id="base-url-row" hidden>
        <label for="base-url">Service address</label>
        <input id="base-url" type="text" list="base-url-options" autocomplete="off" placeholder="https://…/v1">
        <datalist id="base-url-options"></datalist>
      </div>

      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off">
      <label class="inline"><input id="remember-key" type="checkbox"> Remember on this device</label>
      <p class="hint" id="key-hint"></p>

      <label for="model">Model</label>
      <div class="field-row">
        <input id="model" type="text" list="model-options" autocomplete="off" placeholder="model name">
        <button id="list-models" class="small" type="button">List models</button>
      </div>
      <datalist id="model-options"></datalist>
    </details>

    <label for="passage">Passage</label>
    <textarea id="passage" placeholder="Paste a paragraph from a book…"></textarea>
    <div class="row">
      <button id="run" class="primary">Map places</button>
      <button id="example" class="link">Load example</button>
      <button id="clear" class="link">Clear</button>
    </div>

    <div id="status" role="status"></div>
    <div id="period" hidden></div>
    <ol id="results"></ol>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="layers" class="panel">
      <div class="panel-title">Layers</div>
      <label><input type="checkbox" data-group="relief" checked> Elevation colours</label>
      <label><input type="checkbox" data-group="hillshade" checked> Hillshade</label>
      <label><input type="checkbox" data-group="labels" checked> Modern place names</label>
      <label><input type="checkbox" data-group="borders"> Modern borders</label>
      <div class="panel-section">
        <label><input type="checkbox" id="hist-on"> Historical borders</label>
        <div id="hist-controls" hidden>
          <div class="hist-date">
            <select id="hist-month" aria-label="Month"></select>
            <input id="hist-year-num" type="number" min="1886" max="2019" value="1942" aria-label="Year">
          </div>
          <input id="hist-year" type="range" min="1886" max="2019" value="1942" aria-label="Year slider">
          <div class="panel-note">CShapes 2.0 (1886–2019)</div>
        </div>
        <div id="hist-inferred" class="panel-note inferred" hidden></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="js/basemap.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/llm.js"></script>
  <script src="js/wikidata.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/borders.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
